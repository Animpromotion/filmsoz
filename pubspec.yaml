name: filmsoz_studio
description: "Professional Screenwriting Software"
publish_to: 'none'

version: 2.0.0+20

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Гугл-шрифты
  google_fonts: ^6.1.0

  # Работа с файлами
  path_provider: ^2.1.2
  path: ^1.9.0
  file_selector: ^1.1.0

  # PDF export, preview, and printing
  pdf: ^3.13.0
  printing: ^5.15.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true